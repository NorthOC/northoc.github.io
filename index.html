  <!-- blob animation script – preserved exactly as original with minor resize improvement -->
  <script>
    (function() {
      const canvas = document.getElementById("blob");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      const SIZE = 500;

      const points = [
        [230, 51], [267, 53], [304, 50], [339, 72], [363, 89],
        [372, 111], [373, 141], [380, 165], [399, 185], [414, 203],
        [377, 226], [398, 252], [373, 282], [387, 306], [374, 332],
        [359, 359], [347, 386], [331, 414], [308, 403], [281, 401],
        [253, 438], [230, 409], [208, 413], [187, 398], [166, 395],
        [144, 400], [124, 406], [109, 401], [99, 382], [88, 365],
        [70, 353], [58, 339], [52, 315], [47, 288], [48, 272],
        [61, 256], [79, 239], [89, 226], [87, 211], [77, 192],
        [66, 174], [92, 156], [65, 137], [78, 119], [99, 79],
        [125, 80], [155, 65], [190, 94]
      ];

      const center = { x: 240, y: 235 };

      // Animation tuning
      const SPEED = 0.00565;
      const LIQUIDITY = 0;
      const SECONDARY_MOTION = 3;
      const FILL_COLOR = "#00000000";
      const OUTLINE_COLOR = "#000000";
      const OUTLINE_WIDTH = 0.55;
      const ROTATION_SPEED = 0.00155;
      const ROTATION_AMOUNT = 0.15;

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();

        canvas.width = Math.round(rect.width);
        canvas.height = Math.round(rect.height);

        ctx.setTransform(
          canvas.width / SIZE,
          0,
          0,
          canvas.height / SIZE,
          0,
          0
        );
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function drawBlob(time) {
        ctx.clearRect(0, 0, SIZE, SIZE);

        const t = time * SPEED;

        const animatedPoints = points.map(([x, y], i) => {
          const dx = x - center.x;
          const dy = y - center.y;

          const originalAngle = Math.atan2(dy, dx);
          const radius = Math.hypot(dx, dy);

          const rotation =
            time * ROTATION_SPEED * ROTATION_AMOUNT +
            Math.sin(time * ROTATION_SPEED - 0.065 + i * 0.012) * 0.0025;

          const angle = originalAngle + rotation;

          const broadWave =
            Math.sin(t * 1.4 + originalAngle * 1.1) * 1.1 +
            Math.sin(t * 1.4 - originalAngle * 1.4) * 1.01 +
            Math.cos(t * 1.1 + originalAngle * 1.6) * 1.1;

          const localWave =
            Math.sin(t * 0.5 + i * 0.1) * 0.2 +
            Math.cos(t * 1.44 - i * 0.66) * 0.14 +
            Math.sin(t * 1.08 + i * 1.48) * 1.4;

          const displacement =
            LIQUIDITY * broadWave +
            SECONDARY_MOTION * localWave;

          const tangent =
            Math.sin(t * 1.01 - i * 1.01) * 0.08;

          const breathing = Math.sin(t * 0.1) * 0.1;
          const r = radius + displacement + breathing;

          return {
            x: center.x + Math.cos(angle) * r - Math.sin(angle) * tangent,
            y: center.y + Math.sin(angle) * r + Math.cos(angle) * tangent
          };
        });

        ctx.beginPath();

        const first = animatedPoints[0];
        const last = animatedPoints[animatedPoints.length - 1];

        ctx.moveTo(
          (first.x + last.x) / 2,
          (first.y + last.y) / 2
        );

        for (let i = 0; i < animatedPoints.length; i++) {
          const current = animatedPoints[i];
          const next = animatedPoints[(i + 1) % animatedPoints.length];

          ctx.quadraticCurveTo(
            current.x,
            current.y,
            (current.x + next.x) / 2,
            (current.y + next.y) / 2
          );
        }

        ctx.closePath();

        ctx.fillStyle = FILL_COLOR;
        ctx.fill();

        ctx.strokeStyle = OUTLINE_COLOR;
        ctx.lineWidth = OUTLINE_WIDTH;
        ctx.lineJoin = "round";
        ctx.stroke();
      }

      function animate(time) {
        drawBlob(time);
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    })();
  </script>
