  
  <main class="travel-section">
    <section class="globe-layout" aria-label="Visited countries globe">
      <div class="globe-card">
        <div class="globe-topline">
          <div class="drag-hint">DRAG TO ROTATE | SCROLL TO ZOOM</div>
        </div>
        <div id="globeViz" aria-label="Interactive 3D globe showing visited countries"></div>
        <div class="tooltip" id="countryTooltip" role="status">Hover over a country to explore</div>
      </div>

      <aside class="side-card">
        <div class="side-label">World coverage</div>
        <div>
          <div class="stat"><span class="stat-number" id="countryCount">0</span><span class="stat-suffix">countries</span></div>
          <div class="stat-caption">explored so far</div>
        </div>
        <div>
          <div class="side-label">Land explored</div>
          <div class="stat"><span class="stat-number" id="coverage">0%</span></div>
          <div class="stat-caption">of 195 countries</div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="legend"><span class="swatch"></span> Countries visited</div>
        </aside>
    </section>
  </main>

      return alpha2 ? countryNames.of(alpha2) : "Country " + padded;

    document.getElementById("countryCount").textContent = visited.size;
    document.getElementById("coverage").textContent = Math.round(visited.size / 195 * 100) + "%";
    document.getElementById("progressFill").style.width = Math.min(visited.size / 195 * 100, 100) + "%";

    const globeElement = document.getElementById("globeViz");
    if (typeof Globe !== "function") {
      globeElement.innerHTML = '<div class="error">The 3D globe library did not load. Check your connection or CDN access, then reload this page.</div>';
      throw new Error("globe.gl failed to load. Check the CDN script request in the Network tab.");
    }

    const globe = Globe()(globeElement)
      .backgroundColor("rgba(0,0,0,0)")
      .showAtmosphere(true)
      .atmosphereColor("#247cff")
      .atmosphereAltitude(0.18)
      .globeImageUrl("https://unpkg.com/three-globe/example/img/earth-night.jpg")
      .polygonsData([])
      .polygonCapColor(feature => visited.has(String(feature.id).padStart(3, "0")) ? "rgba(45, 220, 255, 0.78)" : "rgba(15, 34, 62, 0.58)")
      .polygonSideColor(feature => visited.has(String(feature.id).padStart(3, "0")) ? "rgba(45, 220, 255, 0.22)" : "rgba(30, 65, 100, 0.12)")
      .polygonStrokeColor(feature => visited.has(String(feature.id).padStart(3, "0")) ? "#8af4ff" : "rgba(112, 160, 210, 0.42)")
      .polygonAltitude(feature => visited.has(String(feature.id).padStart(3, "0")) ? 0.012 : 0.002)
      .polygonLabel(feature => {
        const code = String(feature.id).padStart(3, "0");
        return `<div style="font:12px Inter,system-ui,sans-serif;padding:7px 10px;color:#eafaff;background:rgba(4,12,27,.94);border:1px solid rgba(72,229,255,.35);border-radius:8px;box-shadow:0 0 20px rgba(0,0,0,.25)"><strong>${codeToName(code)}</strong>${visited.has(code) ? '<div style="color:#48e5ff;margin-top:3px">✓ Visited</div>' : ''}</div>`;
      });

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.38;
    globe.controls().enableDamping = true;
    globe.controls().dampingFactor = 0.08;
    globe.pointOfView({ lat: 25, lng: 12, altitude: 2.25 }, 0);

    // The country geometry is fetched from the public World Atlas dataset.
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then(response => {
        if (!response.ok) throw new Error("Could not load country geometry.");
        return response.json();
      })
      .then(topology => {
        const countries = topojson.feature(topology, topology.objects.countries).features;
        globe.polygonsData(countries);
        window.addEventListener("resize", resizeGlobe);
        resizeGlobe();
      })
      .catch(error => {
        console.error(error);
        globeElement.innerHTML = '<div class="error">The globe data could not load. Check your internet connection or try again.</div>';
      });

    function resizeGlobe() {
      const width = globeElement.clientWidth;
      const height = globeElement.clientHeight;
      globe.width(width);
      globe.height(height);
    }

    // Keep a friendly tooltip at the bottom, and use the globe's label on hover.
    globe.onPolygonHover(feature => {
      if (!feature) {
        tooltip.textContent = "Hover over a country to explore";
        return;
      }
      const code = String(feature.id).padStart(3, "0");
      tooltip.textContent = codeToName(code) + (visited.has(code) ? " · VISITED ✓" : "");
    });

    // Pause auto-rotation while the visitor is interacting with the globe.
    globeElement.addEventListener("pointerdown", () => { globe.controls().autoRotate = false; });
    globeElement.addEventListener("pointerup", () => {
      window.setTimeout(() => { globe.controls().autoRotate = true; }, 3500);
    });
